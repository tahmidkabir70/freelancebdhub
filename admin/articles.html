<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>আর্টিকেলসমূহ (Manage Articles) | Freelance BD Hub Admin</title>
  <link rel="icon" type="image/svg+xml" href="/assets/images/logo.svg" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/responsive.css" />
  <link rel="stylesheet" href="/admin-assets/css/admin.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-header">
        <img src="/assets/images/logo.svg" alt="FBH" style="width:34px;height:34px;border-radius:8px;" />
        <span class="brand-title" style="font-size:1.1rem;">FBH Admin</span>
      </div>
      <ul class="admin-nav-list">
        <li class="admin-nav-item"><a href="/admin/dashboard.html" data-tab="dashboard">📊 ড্যাশবোর্ড</a></li>
        <li class="admin-nav-item"><a href="/admin/articles.html" data-tab="articles">📰 আর্টিকেলসমূহ</a></li>
        <li class="admin-nav-item"><a href="/admin/article-editor.html" data-tab="editor">✍️ নতুন আর্টিকেল</a></li>
        <li class="admin-nav-item"><a href="/admin/categories.html" data-tab="categories">🏷️ ক্যাটাগরি</a></li>
        <li class="admin-nav-item"><a href="/admin/media.html" data-tab="media">🖼️ মিডিয়া লাইব্রেরি</a></li>
        <li class="admin-nav-item"><a href="/admin/comments.html" data-tab="comments">💬 মন্তব্য</a></li>
        <li class="admin-nav-item"><a href="/admin/ads.html" data-tab="ads">📢 বিজ্ঞাপন</a></li>
        <li class="admin-nav-item"><a href="/admin/analytics.html" data-tab="analytics">📈 অ্যানালিটিক্স</a></li>
        <li class="admin-nav-item"><a href="/admin/seo.html" data-tab="seo">🔍 এসইও</a></li>
        <li class="admin-nav-item"><a href="/admin/settings.html" data-tab="settings">⚙️ সেটিংস</a></li>
      </ul>
      <div style="padding:1rem; border-top:1px solid var(--border-subtle);">
        <button class="btn btn-secondary btn-sm admin-logout-btn" style="width:100%; justify-content:center; color:#ef4444;">
          🚪 লগআউট
        </button>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <h2 style="font-size:1.25rem; font-weight:800; color:var(--text-primary);">আর্টিকেল ম্যানেজমেন্ট</h2>
        <div style="display:flex; align-items:center; gap:1rem;">
          <a href="/admin/article-editor.html" class="btn btn-primary btn-sm">+ নতুন আর্টিকেল লিখুন</a>
          <button class="theme-toggle-btn" aria-label="Toggle Theme">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </header>

      <main class="admin-page-content">
        <!-- Controls & Filters Card -->
        <div style="background:var(--bg-surface); border:1px solid var(--border-subtle); border-radius:var(--radius-lg); padding:1.25rem; margin-bottom:1.5rem; display:flex; flex-direction:column; gap:1rem;">
          <!-- Tabs -->
          <div style="display:flex; gap:0.5rem; overflow-x:auto; padding-bottom:0.25rem;">
            <button class="btn btn-secondary btn-sm articles-tab-btn active" data-status="all">সকল আর্টিকেল (All)</button>
            <button class="btn btn-secondary btn-sm articles-tab-btn" data-status="published">প্রকাশিত (Published)</button>
            <button class="btn btn-secondary btn-sm articles-tab-btn" data-status="draft">খসড়া (Draft)</button>
            <button class="btn btn-secondary btn-sm articles-tab-btn" data-status="scheduled">তফসিলকৃত (Scheduled)</button>
            <button class="btn btn-secondary btn-sm articles-tab-btn" data-status="archived">আর্কাইভ (Archived)</button>
          </div>

          <!-- Search & Count Bar -->
          <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem;">
            <div style="position:relative; width:min(380px, 100%);">
              <input type="text" id="articles-search-input" class="form-input" placeholder="আর্টিকেল খুঁজুন..." style="padding-left:2.5rem; font-size:0.9rem;" />
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="position:absolute; left:0.8rem; top:50%; transform:translateY(-50%); opacity:0.5;">
                <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </div>
            <span class="badge badge-primary" id="articles-count-badge">০টি আর্টিকেল</span>
          </div>
        </div>

        <!-- Articles Table / Cards Container -->
        <div class="data-table-card" id="articles-list-container">
          <div class="skeleton" style="height:320px; border-radius:12px;"></div>
        </div>
      </main>
    </div>

    <!-- Mobile Bottom Navigation -->
    <nav class="admin-bottom-nav">
      <div class="admin-bottom-nav-inner">
        <a href="/admin/dashboard.html" class="admin-bottom-tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg><span>ড্যাশবোর্ড</span></a>
        <a href="/admin/articles.html" class="admin-bottom-tab active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span>আর্টিকেল</span></a>
        <a href="/admin/article-editor.html" class="admin-bottom-tab" style="color:var(--primary); font-weight:800;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>+লিখুন</span></a>
        <a href="/admin/ads.html" class="admin-bottom-tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/></svg><span>বিজ্ঞাপন</span></a>
        <a href="/admin/settings.html" class="admin-bottom-tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>সেটিংস</span></a>
      </div>
    </nav>
  </div>

  <script type="module">
    import { requireAdmin } from '/admin-assets/js/admin-guard.js';
    import { setupAdminLayout } from '/admin-assets/js/admin-core.js';
    import { initAdminArticles } from '/admin-assets/js/admin-articles.js';

    async function init() {
      await requireAdmin();
      setupAdminLayout('articles');
      await initAdminArticles();
    }
    init();
  </script>
</body>
</html>
