<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>এডমিন লগইন (Admin Login) | Freelance BD Hub</title>
  <link rel="icon" type="image/svg+xml" href="/assets/images/logo.svg" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/responsive.css" />
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--grad-hero); padding:1.25rem;">
  <div style="width:100%; max-width:440px; background:var(--bg-surface); border:1px solid var(--border-subtle); border-radius:var(--radius-xl); box-shadow:var(--shadow-xl); padding:2.5rem 2rem;">
    <!-- Brand Monogram Logo -->
    <div style="text-align:center; margin-bottom:1.75rem;">
      <a href="/" style="display:inline-block;">
        <img src="/assets/images/logo.svg" alt="FBH Logo" style="width:52px; height:52px; margin:0 auto 0.75rem; border-radius:14px;" />
      </a>
      <h1 style="font-size:1.6rem; font-weight:800; color:var(--text-primary); margin-bottom:0.25rem;">
        Freelance BD Hub
      </h1>
      <p style="font-size:0.85rem; color:var(--text-muted);">এডমিন কন্ট্রোল প্যানেলে প্রবেশ করুন (Admin Portal)</p>
    </div>

    <!-- Error Alert Container -->
    <div id="login-error-alert" style="display:none; padding:0.85rem 1rem; border-radius:var(--radius-md); background:rgba(239,68,68,0.1); border:1px solid #ef4444; color:#ef4444; font-size:0.88rem; margin-bottom:1.5rem;"></div>

    <form id="admin-login-form" style="display:flex; flex-direction:column; gap:1.25rem;">
      <div class="form-group">
        <label class="form-label" for="login-email">এডমিন ইমেইল (Admin Email)</label>
        <input type="email" id="login-email" class="form-input" required placeholder="irinkabir79@gmail.com" />
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">পাসওয়ার্ড (Password)</label>
        <div style="position:relative;">
          <input type="password" id="login-password" class="form-input" required placeholder="••••••••" style="padding-right:3rem;" />
          <button type="button" id="toggle-password-btn" aria-label="Toggle password" style="position:absolute; right:0.75rem; top:50%; transform:translateY(-50%); font-size:1.1rem; opacity:0.7;">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" id="login-submit-btn" style="width:100%; justify-content:center; margin-top:0.5rem; font-weight:700;">
        লগইন করুন (Sign In)
      </button>

      <div style="text-align:center; margin-top:1rem;">
        <a href="/" style="font-size:0.85rem; color:var(--text-muted);">← মূল ওয়েবসাইটে ফিরে যান</a>
      </div>
    </form>
  </div>

  <script type="module">
    import { initAdminLogin } from '/admin-assets/js/admin-login.js';
    import { initTheme } from '/assets/js/utils.js';
    initTheme();
    initAdminLogin();
  </script>
</body>
</html>
