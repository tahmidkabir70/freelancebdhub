<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>পৃষ্ঠাটি পাওয়া যায়নি (404 Not Found) | Freelance BD Hub</title>
  <link rel="icon" type="image/svg+xml" href="/assets/images/logo.svg" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/responsive.css" />
</head>
<body>
  <main class="main-content container" style="display:flex; align-items:center; justify-content:center; min-height:80vh; padding:2rem;">
    <div style="text-align:center; max-width:540px; background:var(--bg-surface); padding:3rem 2rem; border-radius:var(--radius-xl); border:1px solid var(--border-subtle); box-shadow:var(--shadow-lg);">
      <div style="font-size:5rem; font-weight:900; background:var(--grad-primary); -webkit-background-clip:text; -webkit-text-fill-color:transparent; line-height:1; margin-bottom:1rem;">
        404
      </div>
      <h1 style="font-size:1.8rem; font-weight:800; margin-bottom:0.75rem; color:var(--text-primary);">
        পৃষ্ঠাটি খুঁজে পাওয়া যায়নি
      </h1>
      <p style="color:var(--text-muted); font-size:1rem; margin-bottom:2rem; line-height:1.6;">
        দুঃখিত, আপনি যে আর্টিকেল বা পৃষ্ঠাটি খুঁজছেন সেটি স্থানান্তরিত বা মুছে ফেলা হয়েছে।
      </p>

      <div style="margin-bottom:2rem;">
        <form action="/search.html" method="GET" style="display:flex; gap:0.5rem;">
          <input type="text" name="q" class="form-input" placeholder="আর্টিকেল খুঁজুন..." required style="flex:1;" />
          <button type="submit" class="btn btn-primary btn-sm">অনুসন্ধান</button>
        </form>
      </div>

      <div style="display:flex; justify-content:center; gap:1rem; flex-wrap:wrap;">
        <a href="/" class="btn btn-primary">← হোমপেজে ফিরে যান</a>
        <a href="/category.html" class="btn btn-secondary">ক্যাটাগরি ব্রাউজ করুন</a>
      </div>
    </div>
  </main>
  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
