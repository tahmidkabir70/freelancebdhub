<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="fbh-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="75%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="cursor-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Rounded Base Card -->
  <rect x="8" y="8" width="84" height="84" rx="22" fill="url(#fbh-grad)" filter="url(#shadow)" />
  
  <!-- Subtle Internal Border -->
  <rect x="9.5" y="9.5" width="81" height="81" rx="20.5" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />
  
  <!-- FBH Monogram -->
  <text x="36" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="-1">FB</text>
  
  <!-- Stylized Hub H -->
  <text x="69" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#38bdf8" letter-spacing="-1">H</text>

  <!-- Modern Click/Cursor Node Accent at Bottom Right -->
  <circle cx="74" cy="74" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
  <path d="M74 62 L74 69" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <path d="M62 74 L69 74" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
</svg>
